<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>おみくじアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">おみくじアプリ</h1>
    <p class="description">ボタンを押して、今日の運勢を引いてみましょう。</p>

    <section class="result-box" id="resultBox" aria-live="polite">
      <p class="result-label">今日の運勢</p>
      <p class="result-text" id="resultText">まだ引いていません</p>
    </section>

    <button type="button" class="draw-button" id="drawButton">おみくじを引く</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
